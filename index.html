<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4243b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Biblioteca Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: encabezado fijo, lista desplazable, barra inferior de pestañas; ficha a pantalla completa. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#16202e; --muted:#586377; --line:#dce1e8;
  --accent:#a4243b; --accent-ink:#ffffff; --soft:#e8ecf2;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b8; --line:#2a3544;
    --accent:#e26b80; --accent-ink:#1a0b10; --soft:#212c3a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202b; --ink:#e8edf4; --muted:#9aa6b8; --line:#2a3544;
  --accent:#e26b80; --accent-ink:#1a0b10; --soft:#212c3a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header.top{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
header.top h1{font-family:var(--font-display);font-size:22px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
header.top p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
main{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:11px 2px 10px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--soft);color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools input[type=search]{grid-column:1/-1}
.tools input,.tools select,.field input,.field textarea,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.tools select{min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--font-display);font-size:16.5px;line-height:1.25;margin:0;font-weight:600;text-wrap:balance}
.card .cite{color:var(--muted);font-size:12.5px}
.card .res{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.lvl{background:var(--ink);color:var(--bg);font-weight:600}
.chip.src{border:1px solid var(--line);background:transparent;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:4px 2px;font-size:18px;line-height:1;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--accent)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:17px;margin-bottom:4px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:13px}
.field textarea{min-height:170px;resize:vertical}
h2.sec{font-family:var(--font-display);font-size:18px;margin:0 0 8px;font-weight:600}
#detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;display:none;-webkit-overflow-scrolling:touch}
#detail.open{display:block}
.sheet{max-width:760px;margin:0 auto;padding:0 16px 40px}
.sheet .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:2}
.sheet h2{font-family:var(--font-display);font-size:21px;line-height:1.2;margin:14px 0 6px;text-wrap:balance}
.sheet .vanc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:13.5px;margin:10px 0}
dl.fields{display:grid;gap:12px;margin:14px 0}
dl.fields dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
dl.fields dd{margin:2px 0 0;max-width:68ch}
.diag{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin:12px 0;overflow-x:auto}
.diag svg{display:block;width:100%;height:auto;max-width:420px;margin:0 auto}
.foot{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:40;max-width:90%}
.spin{color:var(--muted);font-size:13px}
.sg{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sg-plus{background:rgba(63,139,90,.20)} .sg-eq{background:var(--soft)} .sg-minus{background:rgba(164,36,59,.20)} .sg-na{border:1px dashed var(--muted);color:var(--muted)}
.orow{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
.pico{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin:8px 0}
.pico b{color:var(--accent)}
.gap{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:10px 0}
.gap b{display:block}
ol.refs{padding-left:20px;font-size:13px} ol.refs li{margin-bottom:6px}
.msg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px;font-family:var(--font-display);font-size:16.5px;line-height:1.4;margin:12px 0}
@media (prefers-reduced-motion: no-preference){ .card{transition:border-color .15s} .card:hover{border-color:var(--accent)} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Biblioteca Clínica</h1>
    <p>Dr. Juan Fernando Carvajal Estupiñán · Cardiólogo e internista</p>
  </header>
  <main id="main" aria-live="polite"></main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" data-tab="buscar" aria-selected="true">Buscar</button>
    <button role="tab" data-tab="candidatos" aria-selected="false">Candidatos<span class="n" id="n-cand">0</span></button>
    <button role="tab" data-tab="biblioteca" aria-selected="false">Biblioteca<span class="n" id="n-bib">0</span></button>
    <button role="tab" data-tab="analisis" aria-selected="false">Análisis<span class="n" id="n-an">0</span></button>
    <button role="tab" data-tab="anadir" aria-selected="false">Añadir</button>
  </nav>
</div>
<div id="detail" role="dialog" aria-modal="true" aria-label="Ficha del artículo"></div>
<div id="toast" class="toast" style="display:none" role="status"></div>

<script src="standalone.js"></script>
<script src="jspdf.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display="none";},3200);
}
var DISENOS = {
  rs:"Revisión sistemática / metaanálisis", eca:"Ensayo clínico aleatorizado",
  cohorte:"Cohorte / observacional", guia:"Guía de práctica", revision:"Revisión narrativa", otro:"Otro"
};
var NIVEL = { rs:"Nivel 1", eca:"Nivel 2", cohorte:"Nivel 3", guia:"Guía", revision:"Nivel 5", otro:"—" };
var AUTORIA = "Dr. Juan Fernando Carvajal Estupiñán · Cardiólogo e internista · Bucaramanga, Colombia";

/* ---------- estado ---------- */
var SA = window.__standalone||null;
var S = { items:[], tab:"buscar", f:{q:"",tema:"",diseno:"",orden:"relevancia"}, openId:null, add:{busy:false,preview:null,err:""}, db:null, sample:null, downloads:null, loaded:false, slow:false, an:[], anOpen:null, bq:[], gen:{}, mcp:null, drive:false, bu:{q:"",carp:"",tipo:"",desde:"",busy:false,msg:"",err:"",estr:""}, ex:{busy:false,msg:"",err:"",tema:""} };

/* ---------- capacidades ---------- */
function getUse(name){
  try{ if(window.claude && typeof window.claude.use==="function"){ return window.claude.use(name).catch(function(){return null;}); } }catch(e){}
  return Promise.resolve(null);
}
Promise.all([getUse("db"),getUse("sample"),getUse("downloads"),getUse("user"),getUse("mcp")]).then(function(r){
  S.db=r[0]; S.sample=r[1]; S.downloads=r[2]; S.mcp=r[4]; S.drive=!!(S.mcp&&(typeof S.mcp.hasServer!=="function"||S.mcp.hasServer("Google Drive")));
  if(S.db){ subscribe(); } else { S.loaded=true; S.slow=false; S.dbErr="nodb"; S.diag="sin acceso a la base de datos en esta vista"; }
  render();
});
function diagLine(){
  return '<p style="margin:0 0 10px;font-size:11.5px;color:var(--muted)">Conexión: '+esc(S.diag||"iniciando…")+' · v10</p>'+(S.saveErr?'<div class="note" style="margin-bottom:12px"><b>'+esc(S.saveErr)+'</b></div>':'');
}
function banner(){
  if(S.dbErr==="nodb") return diagLine()+'<div class="note" style="margin-bottom:12px"><b>La biblioteca no está conectada en esta vista.</b> Recarga la página.</div>';
  if(S.dbErr) return diagLine()+'<div class="note" style="margin-bottom:12px"><b>No se pudo leer la biblioteca</b> ('+esc(S.dbErr.replace("err:",""))+'). Cierra y vuelve a abrir el enlace.</div>';
  return diagLine();
}
function banner_old(){
  if(S.dbErr==="nodb") return '<div class="note" style="margin-bottom:12px"><b>La biblioteca no está conectada en esta vista.</b> Abre el enlace dentro de la app de Claude o en claude.ai con tu sesión iniciada; desde un navegador sin sesión no se ven los artículos.</div>';
  if(S.dbErr) return '<div class="note" style="margin-bottom:12px"><b>No se pudo leer la biblioteca</b> ('+esc(S.dbErr.replace("err:",""))+'). Cierra y vuelve a abrir el enlace.</div>';
  return "";
}

function rowsOf(snap){
  var arr=null;
  if(snap && Array.isArray(snap.docs)) arr=snap.docs;
  else if(Array.isArray(snap)) arr=snap;
  else if(snap && typeof snap.forEach==="function"){ arr=[]; snap.forEach(function(d){arr.push(d);}); }
  if(!arr) throw new Error("forma inesperada: "+(snap===null?"null":typeof snap)+" "+(snap&&typeof snap==="object"?Object.keys(snap).slice(0,6).join(","):""));
  return arr.map(function(d){
    var o=(typeof d.data==="function"?d.data():(d.data||d))||{};
    o=Object.assign({},o); o.id=d.id||o.id; return o;
  });
}
function errText(e){ return (e&&(e.code||e.message))||String(e); }
function subscribe(){
  var timer=setTimeout(function(){ if(!S.loaded){ S.slow=true; render(); } },10000);
  S.diag="base de datos conectada; esperando datos…"; render();
  try{
    S.db.collection("articles").onSnapshot(function(snap){
      try{
        var cache=!!(snap&&snap.metadata&&snap.metadata.fromCache);
        S.items=rowsOf(snap);
        S.diag="base conectada · "+S.items.length+" artículos"+(cache?" (copia local, esperando al servidor)":"");
        if(!(cache && !S.items.length)){ clearTimeout(timer); S.loaded=true; S.slow=false; }
      }catch(e){ S.diag="lectura falló: "+errText(e); }
      render();
    }, function(e){ clearTimeout(timer); S.loaded=true; S.diag="error de suscripción: "+errText(e); render(); });
  }catch(e){ clearTimeout(timer); S.loaded=true; S.diag="error al suscribirse: "+errText(e); render(); }
  try{
    S.db.collection("busquedas").onSnapshot(function(snap){
      try{ S.bq=rowsOf(snap); }catch(e){ S.bq=[]; }
      if(S.tab==="biblioteca") render();
    }, function(){});
  }catch(e){}
  try{
    S.db.collection("analisis").onSnapshot(function(snap){
      try{ S.an=rowsOf(snap); }catch(e){ S.an=[]; }
      var c=$("#n-an"); if(c) c.textContent=S.an.length;
      if(S.tab==="analisis") render(); else renderDetail();
    }, function(){});
  }catch(e){}
  setTimeout(function(){
    if(S.items.length || !S.db) return;
    var p; try{ p=S.db.collection("articles").get(); }catch(e){ S.diag="get() falló: "+errText(e); render(); return; }
    Promise.resolve(p).then(function(snap){
      var rows=rowsOf(snap);
      if(rows.length){ S.items=rows; S.diag="lectura directa · "+rows.length+" artículos"; S.loaded=true; }
      else S.diag="base conectada, pero la colección llegó vacía";
      render();
    }).catch(function(e){ S.diag="lectura directa falló: "+errText(e); render(); });
  },4000);
}

function save(id, patch){
  if(!S.db){ toast("La biblioteca no está disponible en esta vista."); return Promise.resolve(); }
  /* cambio inmediato en pantalla; si la escritura falla, se revierte y se explica */
  var it=S.items.filter(function(x){return x.id===id;})[0], before=null;
  if(it){ before={}; Object.keys(patch).forEach(function(k){ before[k]=it[k]; it[k]=patch[k]; }); refresh(); }
  var p;
  try{ p=S.db.collection("articles").doc(id).update(patch); }
  catch(e){ return failSave(it,before,e); }
  return Promise.resolve(p).then(function(){ S.saveErr=""; },function(e){ return failSave(it,before,e); });
}
function failSave(it,before,e){
  if(it&&before){ Object.keys(before).forEach(function(k){ if(before[k]===undefined) delete it[k]; else it[k]=before[k]; }); }
  S.saveErr="No se pudo guardar el cambio: "+errText(e);
  toast(S.saveErr); render(); return Promise.resolve();
}

/* ---------- citas ---------- */
function vancouver(a){
  var au;
  var list=(a.autores||[]).filter(Boolean);
  if(!list.length){ au="[Autores por verificar]"; }
  else if(list.length>6){ au=list.slice(0,6).join(", ")+", et al"; }
  else if(a.autoresCompletos===false){ au=list.join(", ")+", et al"; }
  else { au=list.join(", "); }
  var t=(a.titulo||"").replace(/[.\s]+$/,"");
  var j=a.revista?(" "+a.revista+"."):"";
  var y=a.anio?(" "+a.anio):"";
  var vol=a.volumen?(";"+a.volumen):"";
  var pag=a.paginas?(":"+a.paginas):"";
  var loc=(y||vol||pag)?(y+vol+pag+"."):"";
  var ids=[]; if(a.doi) ids.push("doi:"+a.doi); if(a.pmid) ids.push("PMID: "+a.pmid);
  return au+". "+t+"."+j+loc+(ids.length?" "+ids.join(". ")+".":"");
}
function shortCite(a){
  var first=(a.autores&&a.autores[0])?a.autores[0].split(" ")[0]+" et al.":"";
  return [first,a.revista,a.anio].filter(Boolean).join(" · ");
}

/* ---------- ficha: texto, diagrama, documento ---------- */
function sumField(a,k){ return (a.resumen&&a.resumen[k])||""; }
function fichaTexto(a){
  var L=[];
  L.push("FICHA BIBLIOGRÁFICA");
  L.push(a.titulo||""); L.push("");
  L.push("Referencia (Vancouver): "+vancouver(a)); L.push("");
  L.push("Diseño: "+(DISENOS[a.diseno]||"—")+" ("+(NIVEL[a.diseno]||"—")+") · Tema: "+(a.tema||"—")+" · Fuente del resumen: "+(a.fuente||"abstract"));
  L.push("");
  [["pregunta","Pregunta"],["poblacion","Población"],["intervencion","Intervención / exposición"],["comparador","Comparador"],["resultado","Resultado clave"],["limitaciones","Limitaciones"],["docencia","Mensaje para enseñar"]].forEach(function(p){
    var v=sumField(a,p[0]); if(v){ L.push(p[1]+": "+v); }
  });
  L.push("");
  if(a.url) L.push("Enlace: "+a.url);
  L.push("Resumen elaborado con IA a partir del "+(a.fuente||"abstract")+"; verificar con el texto original antes de citar.");
  L.push("Elaborado por "+AUTORIA);
  return L.join("\n");
}
function wrapLines(text,max,maxLines){
  var words=String(text||"").split(/\s+/).filter(Boolean), lines=[], cur="";
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if((cur+" "+w).trim().length>max){ lines.push(cur); cur=w; } else { cur=(cur+" "+w).trim(); }
  }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].replace(/[\s,;.]+$/,"")+"…"; }
  return lines;
}
function diagramaSVG(a){
  var rows=[
    {k:"poblacion",lab:"POBLACIÓN",fill:"#e3ebf7",stroke:"#5b7db1"},
    {k:"intervencion",lab:"INTERVENCIÓN / EXPOSICIÓN",fill:"#f6e1e5",stroke:"#a4243b"},
    {k:"comparador",lab:"COMPARADOR",fill:"#eceef2",stroke:"#7b8596"},
    {k:"resultado",lab:"RESULTADO CLAVE",fill:"#e1f0e6",stroke:"#3f8b5a"}
  ];
  var W=380, y=34, out=[], i;
  var head=(DISENOS[a.diseno]||"Estudio")+" · "+(NIVEL[a.diseno]||"");
  out.push('<text x="'+W/2+'" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">'+esc(head)+'</text>');
  for(i=0;i<rows.length;i++){
    var r=rows[i], txt=sumField(a,r.k)||"No consta en el resumen";
    var lines=wrapLines(txt,50,3), h=26+lines.length*15;
    out.push('<rect x="10" y="'+y+'" width="'+(W-20)+'" height="'+h+'" rx="8" fill="'+r.fill+'" stroke="'+r.stroke+'" stroke-width="1.2"/>');
    out.push('<text x="20" y="'+(y+16)+'" font-size="10" font-weight="700" letter-spacing=".6" fill="'+r.stroke+'">'+r.lab+'</text>');
    for(var j=0;j<lines.length;j++){
      out.push('<text x="20" y="'+(y+32+j*15)+'" font-size="12.5" fill="#16202e">'+esc(lines[j])+'</text>');
    }
    y+=h;
    if(i<rows.length-1){
      out.push('<path d="M'+W/2+' '+(y+1)+' v10 m-5 -5 l5 6 l5 -6" fill="none" stroke="#7b8596" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>');
      y+=14;
    }
  }
  var H=y+12;
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema del estudio: población, intervención, comparador y resultado" font-family="IBM Plex Sans, Arial, sans-serif">'+out.join("")+'</svg>';
}
function fichaHTML(a){
  var rows=[["pregunta","Pregunta"],["poblacion","Población"],["intervencion","Intervención / exposición"],["comparador","Comparador"],["resultado","Resultado clave"],["limitaciones","Limitaciones"],["docencia","Mensaje para enseñar"]];
  var dl=rows.map(function(p){ var v=sumField(a,p[0]); return v?('<dt>'+p[1]+'</dt><dd>'+esc(v)+'</dd>'):""; }).join("");
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ficha: '+esc(a.titulo)+'</title><style>'+
  'body{font-family:Arial,Helvetica,sans-serif;color:#16202e;max-width:720px;margin:0 auto;padding:20px 16px;line-height:1.5;background:#fff}'+
  'h1{font-family:Georgia,serif;font-size:22px;line-height:1.25;margin:6px 0 10px}.tag{font-size:12px;letter-spacing:.08em;color:#a4243b;font-weight:700}'+
  '.v{border-left:4px solid #a4243b;background:#f4f6f9;padding:10px 12px;font-size:14px;margin:12px 0}dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#586377;font-weight:700;margin-top:12px}dd{margin:2px 0 0}'+

      var hay=[a.titulo,a.tema,(a.etiquetas||[]).join(" "),a.revista,(a.autores||[]).join(" "),sumField(a,"resultado")].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  r.sort(function(a,b){
    if(f.orden==="anio") return (b.anio||0)-(a.anio||0);
    if(f.orden==="evidencia"){ var o=["rs","eca","cohorte","guia","revision","otro"]; return o.indexOf(a.diseno)-o.indexOf(b.diseno); }
    return (relevanciaOf(b)-relevanciaOf(a)) || ((b.anio||0)-(a.anio||0));
  });
  return r;
}

function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){return true;},function(){return fallbackCopy(text);});
    }
  }catch(e){}
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); var ok=document.execCommand("copy"); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

function estructurar(){
  var text=($("#a-text").value||"").trim(), tema=($("#a-tema").value||"").trim();
  if(text.length<80){ S.add.err="Pega un abstract más completo (al menos unas líneas)."; render(); return; }
  S.add.busy=true; S.add.err=""; S.add.preview=null; render();
  var prompt="Eres un asistente de literatura médica. A partir SOLO del texto entregado, devuelve un objeto JSON válido, sin texto adicional ni markdown, con estas claves: "+
  "titulo, autores (arreglo de strings en formato Vancouver 'Apellido Iniciales'), autoresCompletos (true solo si la lista de autores está completa), revista, anio (número), volumen, paginas, doi, pmid, "+
  "diseno (uno de: rs, eca, cohorte, guia, revision, otro), "+

/* ---------- v9: búsqueda en PubMed dentro de la app ---------- */
function tipoFiltro(tipo){
  if(!tipo) return "";

  if(/aleator/i.test(tipo)) return "Randomized Controlled Trial[Publication Type]";
  if(/gu[ií]as/i.test(tipo)) return "(Practice Guideline[Publication Type] OR Guideline[Publication Type])";
  if(/cohorte/i.test(tipo)) return "Cohort Studies[MeSH Terms]";
  return "";
}
function estrategiaPubmed(q,tipo){
  var filtro=tipoFiltro(tipo);
  function fin(base){ return filtro?("("+base+") AND "+filtro):base; }
  if(/\[(mesh|title|author|tiab|pt|publication type|title\/abstract)/i.test(q) || !S.sample) return Promise.resolve(fin(q));
  var prompt="Convierte esta pregunta clínica en una consulta de búsqueda de PubMed en inglés: usa términos MeSH con [MeSH Terms] y palabras libres con [Title/Abstract], combinados con AND/OR. No incluyas filtros de fecha ni de tipo de estudio. Devuelve SOLO la consulta, en una sola línea, sin comillas externas, sin explicación ni markdown.\n\nPregunta: "+q;
  return S.sample(prompt).then(function(r){
    var t=((r&&r.text)||"").replace(/```[a-z]*/g,"").replace(/\s+/g," ").trim();
    if(t.length<4||t.length>600) return fin(q);
    return fin(t);
  },function(e){ if(e&&e.code==="not_granted") throw e; return fin(q); });
}
function fetchMeta(ids,done){

    var chunk=ids.slice(i,i+5); i+=5;
    return callMcp(PM,"get_article_metadata",{pmids:chunk}).then(function(r){
      var arr=(r&&r.articles)||[]; out=out.concat(arr); if(done) done(out.length); return next();
    });

}
function disenoDe(m,sug){
  var t=(m.article_types||[]).join(" | ");

  var tot=pdfCaja(P,P.m,wFull,"P",sumField(a,"poblacion"),cP0,0,true)+14+Math.max(pdfCaja(P,P.m,wHalf,"I",sumField(a,"intervencion"),cI0,0,true),pdfCaja(P,P.m,wHalf,"C",sumField(a,"comparador"),cC0,0,true))+14+pdfCaja(P,P.m,wFull,"R",sumField(a,"resultado"),cR0,0,true)+12;
  pdfNeed(P,tot);
  var y0=P.y;
  var cP=[[227,235,247],[91,125,177]], cI=[[246,225,229],[164,36,59]], cC=[[236,238,242],[123,133,150]], cR=[[225,240,230],[63,139,90]];
  var h1=pdfCaja(P,P.m,wFull,"POBLACIÓN",sumField(a,"poblacion"),cP,y0,false);
  pdfFlecha(P,P.W/2,y0+h1+3); y0+=h1+14;
  var hi=pdfCaja(P,P.m,wHalf,"INTERVENCIÓN / EXPOSICIÓN",sumField(a,"intervencion"),cI,0,true), hc=pdfCaja(P,P.m+wHalf+gap,wHalf,"COMPARADOR",sumField(a,"comparador"),cC,0,true), hm=Math.max(hi,hc);
  pdfCajaH(P,P.m,wHalf,"INTERVENCIÓN / EXPOSICIÓN",sumField(a,"intervencion"),cI,y0,hm);
  pdfCajaH(P,P.m+wHalf+gap,wHalf,"COMPARADOR",sumField(a,"comparador"),cC,y0,hm);
  pdfFlecha(P,P.W/2,y0+hm+3); y0+=hm+14;
  var hr=pdfCaja(P,P.m,wFull,"RESULTADO CLAVE",sumField(a,"resultado"),cR,y0,false);
  P.y=y0+hr+12;
  [["pregunta","Pregunta"],["limitaciones","Limitaciones"],["docencia","Mensaje para enseñar"]].forEach(function(p){
    var v=sumField(a,p[0]); if(!v) return;
    pdfH(P,p[1]); pdfP(P,v,{size:10});
  });
  if(a.url){ pdfH(P,"Enlace"); pdfP(P,a.url,{size:9,color:[60,90,160]}); }
  return pdfFin(P);
}
function pdfCajaH(P,x,w,label,text,col,y0,h){
  var size=9.5, pad=8, lh=size*1.36;
  P.d.setFont("helvetica","normal"); P.d.setFontSize(size);
  var lines=P.d.splitTextToSize(pdfSan(text||"—"),w-2*pad);
  P.d.setFillColor(col[0][0],col[0][1],col[0][2]); P.d.setDrawColor(col[1][0],col[1][1],col[1][2]); P.d.setLineWidth(1);
  P.d.roundedRect(x,y0,w,h,5,5,"FD");
  P.d.setFont("helvetica","bold"); P.d.setFontSize(7.5); P.d.setTextColor(col[1][0],col[1][1],col[1][2]);
  P.d.text(pdfSan(label),x+pad,y0+pad+6);
  P.d.setFont("helvetica","normal"); P.d.setFontSize(size); P.d.setTextColor(34,40,52);
  lines.forEach(function(ln,i){ P.d.text(ln,x+pad,y0+pad+13+size*0.85+i*lh); });
}

    if(q.diseno) pdfP(P,"Diseño sugerido: "+q.diseno,{size:9.5,indent:10,after:0});

  if((a.referencias||[]).length){ pdfH(P,"Referencias"); a.referencias.forEach(function(r,i){ pdfP(P,(i+1)+". "+r,{size:8.5,indent:6,after:3}); }); }

function busquedasPDF(tema){
  var P=pdfNew("Estrategias de búsqueda");
  pdfP(P,"Tema: "+tema,{size:15,bold:true,after:6,color:[24,30,44]});
  var its=S.items.filter(function(a){return temaDe(a)===tema;}), n=function(e){return its.filter(function(a){return (a.estado||"candidato")===e;}).length;};
  pdfP(P,"Fecha: "+new Date().toISOString().slice(0,10)+"  |  Candidatos: "+n("candidato")+"  |  Guardados: "+n("guardado")+"  |  Descartados: "+n("descartado"),{size:9,color:[110,120,138],after:8});
  var bs=S.bq.filter(function(b){return (b.tema||"Sin tema")===tema;}).sort(function(a,b){return String(a.fecha).localeCompare(String(b.fecha));});
  pdfH(P,"Búsquedas realizadas");
  if(!bs.length) pdfP(P,"No hay búsquedas registradas para este tema.",{size:10});

    pdfNeed(P,70);

    if(b.total!==undefined) det.push("Encontrados: "+b.total+" | Revisados: "+(b.revisados||0)+" | Nuevos: "+(b.nuevos||0)+" | Ya en biblioteca: "+(b.duplicados||0));
    if(!b.consulta && b.origen!=="app") det.push("Búsqueda hecha en el chat con Claude");

function guardarPdf(filename,pdf){
  if(!S.downloads) return Promise.reject({code:"no_downloads"});
  var blob; try{ blob=new Blob([pdf.u8],{type:"application/pdf"}); }catch(e){ blob=null; }
  return Promise.resolve(blob?S.downloads.save({filename:filename,data:blob}):Promise.reject({code:"x"})).catch(function(e){
    if(e&&e.code==="declined") throw e;
    return S.downloads.save({filename:filename,data:pdf.u8});
  });
}
function pdfDe(kind,obj){
  if(kind==="ficha") return {pdf:fichaPDF(obj),name:"Ficha_"+nomArchivo((obj.autores&&obj.autores[0]||"ficha").split(" ")[0]+"_"+(obj.anio||"")+"_"+(obj.pmid||obj.id))+".pdf"};
  if(kind==="analisis") return {pdf:analisisPDF(obj),name:"Analisis_"+nomArchivo(obj.tema||obj.id)+"_v"+(obj.version||1)+".pdf"};
  return {pdf:busquedasPDF(obj),name:"Estrategias_de_busqueda_"+nomArchivo(obj)+".pdf"};
}
function descargarPdf(kind,obj){
  var r; try{ r=pdfDe(kind,obj); }catch(e){ toast(mcpErr(e)); return; }
  guardarPdf(r.name,r.pdf).then(function(){ toast("PDF listo"); },function(e){ if(!e||e.code!=="declined") toast("No se pudo generar la descarga."); });
}

/* ---------- v9: Google Drive ---------- */
function firstFile(o,depth){
  depth=depth||0; if(!o||depth>4) return null;
  if(Array.isArray(o)){ for(var i=0;i<o.length;i++){ var r=firstFile(o[i],depth+1); if(r) return r; } return null; }
  if(typeof o==="object"){
    if(typeof o.id==="string"&&o.id.length>5) return o;
    var ks=["files","items","results","file","data"]; for(var j=0;j<ks.length;j++){ if(o[ks[j]]){ var r2=firstFile(o[ks[j]],depth+1); if(r2) return r2; } }
  }
  return null;
}
function qs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function driveCarpeta(nombre,padre){
  var q="title = '"+qs(nombre)+"' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"+(padre?(" and parentId = '"+qs(padre)+"'"):"");
  return callMcp(DR,"search_files",{query:q,pageSize:5,excludeContentSnippets:true}).then(function(r){
    var f=firstFile(r); if(f) return f.id;
    var inp={title:nombre,mimeType:"application/vnd.google-apps.folder"}; if(padre) inp.parentId=padre;
    return callMcp(DR,"create_file",inp).then(function(c){
      var f2=firstFile(c); if(f2) return f2.id;
      throw {code:"drive_sin_id",message:"Drive no devolvió el id de la carpeta"};
    });
  });
}
function driveEstado(){
  return Promise.resolve(S.db.collection("drive").get()).then(function(snap){
    var rows=rowsOf(snap), d=rows.filter(function(x){return x.id==="carpetas";})[0];
    return d||{id:"carpetas",raiz:"",temas:{}};
  },function(){ return {id:"carpetas",raiz:"",temas:{}}; });
}
function driveCarpetaTema(tema){
  return driveEstado().then(function(est){
    est.temas=est.temas||{};
    var cambio=false;
    return Promise.resolve(est.raiz||driveCarpeta(RAIZ,null)).then(function(raiz){
      if(raiz!==est.raiz){ est.raiz=raiz; cambio=true; }
      var k=slugTema(tema);
      return Promise.resolve(est.temas[k]||driveCarpeta(tema,raiz)).then(function(tid){
        if(tid!==est.temas[k]){ est.temas[k]=tid; cambio=true; }
        var doc={raiz:est.raiz,temas:est.temas};
        var w=cambio?Promise.resolve(S.db.collection("drive").doc("carpetas").set(doc)).catch(function(){}):Promise.resolve();
        return w.then(function(){ return tid; });
      });
    });
  });
}
function driveSubir(carpetaId,nombre,pdf){
  return callMcp(DR,"create_file",{title:nombre,base64Content:pdf.b64,contentMimeType:"application/pdf",disableConversionToGoogleType:true,parentId:carpetaId}).then(function(r){
    var f=firstFile(r); return f?f.id:"ok";
  });
}
function exMsg(t){ S.ex.msg=t; var el=$("#ex-msg"); if(el) el.textContent=t; }
function enDrive(kind,obj,tema){
  if(!S.drive||!S.db){ toast("Drive no está disponible en esta vista."); return Promise.resolve(); }
  toast("Guardando en Drive…");
  var r; try{ r=pdfDe(kind,obj); }catch(e){ toast(mcpErr(e)); return Promise.resolve(); }
  return driveCarpetaTema(tema).then(function(cid){ return driveSubir(cid,r.name,r.pdf); }).then(function(fid){
    if(kind==="ficha") save(obj.id,{driveId:String(fid),driveFecha:new Date().toISOString().slice(0,10)});
    toast("Guardado en Drive: "+RAIZ+" / "+tema);
  }).catch(function(e){ toast(mcpErr(e)); });
}
function exportarTema(tema){
  if(S.ex.busy) return;
  if(!S.drive||!S.db){ toast("Drive no está disponible en esta vista."); return; }
  S.ex={busy:true,tema:tema,msg:"Preparando carpeta en Drive…",err:""}; render();
  var ok=0, omit=0, fallos=0, carpeta;
  var fichas=guardadosDe(tema), an=analisisDe(tema);
  var tareas=[];
  tareas.push({n:"estrategias",f:function(){ var r=pdfDe("busquedas",tema); return driveSubir(carpeta,r.name,r.pdf); }});
  if(an) tareas.push({n:"análisis",f:function(){ var r=pdfDe("analisis",an); return driveSubir(carpeta,r.name,r.pdf).then(function(fid){ return S.db.collection("analisis").doc(an.id).update({driveVersion:an.version||1}); }); }});
  fichas.forEach(function(a){ if(a.driveId){ omit++; return; } tareas.push({n:"ficha",f:function(){ var r=pdfDe("ficha",a); return driveSubir(carpeta,r.name,r.pdf).then(function(fid){ return S.db.collection("articles").doc(a.id).update({driveId:String(fid),driveFecha:new Date().toISOString().slice(0,10)}); }); }}); });
  driveCarpetaTema(tema).then(function(cid){
    carpeta=cid; var i=0;
    function paso(){
      if(i>=tareas.length) return Promise.resolve();
      var t=tareas[i++]; exMsg("Subiendo PDF "+i+" de "+tareas.length+"…");
      return Promise.resolve().then(t.f).then(function(){ ok++; },function(e){ fallos++; S.ex.err=mcpErr(e); }).then(paso);
    }
    return paso();
  }).then(function(){
    S.ex.busy=false; S.ex.msg=ok+" PDF subido"+(ok===1?"":"s")+" a Drive ("+RAIZ+" / "+tema+")"+(omit?(" · "+omit+" ficha"+(omit===1?"":"s")+" ya estaba"+(omit===1?"":"n")):"")+(fallos?(" · "+fallos+" con error"):"");
    render(); toast(fallos?"Exportación con errores":"Exportado a Drive");
  }).catch(function(e){ S.ex.busy=false; S.ex.err=mcpErr(e); S.ex.msg=""; render(); });
}
function probarConexiones(){

}
